# Builds, signs, notarizes and staples Culla-<version>.dmg when a tag v<version> is pushed, and
# attaches it to a draft GitHub Release for the owner to check and publish. The work is done by
# Scripts/release.sh, which runs the same way on the owner's Mac; this file only prepares the
# runner (Xcode, a temporary keychain, the API key) and creates the draft.
#
# Repository secrets:
#   DEVELOPER_ID_P12_BASE64    the Developer ID Application certificate and its private key, .p12, base64
#   DEVELOPER_ID_P12_PASSWORD  the password of that .p12
#   NOTARY_KEY_P8_BASE64       an App Store Connect API key (.p8), base64
#   NOTARY_KEY_ID              its key ID
#   NOTARY_ISSUER_ID           its issuer ID
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # The GitHub-hosted image with Xcode 27 (macOS 27, arm64); see actions/runner-images.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      XCODE_APP: /Applications/Xcode_27.1.app
      TAG: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=""
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Refuse to overwrite an existing release
        run: |
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists in $REPOSITORY. Delete it (or push a new version tag) before running this again; this workflow never overwrites a release."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Test the package
        id: test
        run: cd CullaKit && swift test

      # A test process killed by a trap inside a system framework prints nothing to the log; its
      # reason and backtrace are only in the crash report. Never fails the job by itself.
      - name: Show the crash reports of the tests
        if: failure() && steps.test.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 2
        run: python3 Scripts/crash-reports.py --minutes 30 --max-reports 4 --max-lines 150

      - name: Check the translations
        run: python3 Scripts/l10n.py check --require ru,tk

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/culla-signing.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # Put the temporary keychain first in the user search list, keeping the others.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line%\"}"; line="${line#\"}"
            [ -n "$line" ] && existing+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          # A .p12 exported without its chain needs Apple's Developer ID intermediate to be valid.
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"; then
            curl --fail --silent --show-error --location -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" >/dev/null
          fi
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" \
            || { echo "::error::The certificate in DEVELOPER_ID_P12_BASE64 gives no valid Developer ID Application identity"; exit 1; }

      - name: Write the App Store Connect API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"

      - name: Build, sign, notarize and staple
        id: release
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: NOTARY_KEY_PATH="$RUNNER_TEMP/notary-key.p8" Scripts/release.sh --tag "$TAG" --out "$RUNNER_TEMP/release"

      - name: Create the draft release
        env:
          DMG: ${{ steps.release.outputs.dmg }}
          DMG_FILE: ${{ steps.release.outputs.file }}
          VERSION: ${{ steps.release.outputs.version }}
          SIZE: ${{ steps.release.outputs.size }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "The disk image is signed with Developer ID and notarized by Apple; the ticket is stapled."
            echo
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| \`$DMG_FILE\` | $SIZE bytes | \`$SHA256\` |"
          } > "$notes"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for $TAG appeared while this workflow ran; not overwriting it."
            exit 1
          fi
          gh release create "$TAG" "$DMG" --repo "$REPOSITORY" --verify-tag --draft --title "Culla $VERSION" --notes-file "$notes"
          echo "Draft release for $TAG created with $DMG_FILE ($SIZE bytes, SHA-256 $SHA256)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keychain and the keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/culla-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"

# First-time configuration for cullaapp.com: plain HTTP only.
#
# nginx refuses to start while a configuration names certificate files that
# do not exist yet. So the first time, setup-host.sh installs this file as
# /etc/nginx/conf.d/cullaapp.com.conf, certbot gets the certificate through
# the host's webroot (/var/www/letsencrypt, served by the host's
# acme-challenge snippet), and then setup-host.sh replaces it with the full
# configuration (cullaapp.com.conf). Variant lines (#@www, #@ipv6) as in
# cullaapp.com.conf; see remote-install.sh. See SETUP.md.
#
# It needs no other file from this folder, and like cullaapp.com.conf sets
# nothing at http level that the host already sets.

# Shortened client addresses, exactly as in cullaapp.com.conf, so that even
# during setup no full address is written to disk.
map $remote_addr $ip_short {
    "~^(\d+\.\d+\.\d+)\.\d+$"                                  $1.0;
    "~^::ffff:(\d+\.\d+\.\d+)\.\d+$"                           $1.0;
    "~^([0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"           $1::;
    "~^([0-9a-f]{1,4}:[0-9a-f]{1,4})::"                        $1::;
    "~^([0-9a-f]{1,4})::"                                      $1::;
    "~^::"                                                     ::;
    default                                                    "-";
}

log_format cullaapp_access escape=json
    '{"time":"$time_iso8601","ip":"$ip_short","host":"$host",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"referrer":"$http_referer",'
    '"ua":"$http_user_agent"}';

server {
    listen 80;
    listen [::]:80;                              #@ipv6
    server_name cullaapp.com;                    #@!www
    server_name cullaapp.com www.cullaapp.com;   #@www

    access_log /data/cullaapp.com/log/access.log cullaapp_access;
    error_log  /data/cullaapp.com/log/error.log crit;
    server_tokens off;

    # The host's snippet: the files certbot --webroot writes.
    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        default_type text/plain;
        return 503 "cullaapp.com is being set up.\n";
    }
}

# The certificate, shared by the HTTPS server blocks (cullaapp.com, and
# www.cullaapp.com when it is served).
#
# The certificate is requested with `certbot certonly --webroot
# --cert-name cullaapp.com`, so certbot never edits nginx files; it only
# replaces the files these lines point at, and the host's renewal hook
# reloads nginx.
#
# Protocols, ciphers, the session cache and session tickets are the host's,
# set once at http level in nginx.conf and conf.d/00-default.conf for every
# site on it. No OCSP stapling: Let's Encrypt stopped running OCSP
# responders in 2025.
ssl_certificate     /etc/letsencrypt/live/cullaapp.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/cullaapp.com/privkey.pem;

# Security headers for every response from cullaapp.com.
#
# nginx trap: a block that has any add_header of its own forgets every
# add_header from the blocks around it. So this file is included in the
# server block AND in every location that adds a header of its own.
# "always" makes the headers appear on redirects and error pages too.

# HSTS starts at 30 days, without includeSubDomains and without preload.
# Raise it (for example to 31536000) once the site has run on HTTPS for a
# few weeks without trouble. See SETUP.md, "HSTS".
add_header Strict-Transport-Security "max-age=2592000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;

# Fallback for /download, used while no release is published.
#
# The location = /download block first includes
# /etc/nginx/cullaapp/download-target.conf (written by deploy.sh from
# site/release.json once the release has a date), whose single
# `return 302 https://github.com/...;` wins because rewrite directives run in
# order and the first `return` ends processing. When that file does not
# exist, this `return 503;` answers instead and the friendly page
# /_errors/download-503.html is shown.
return 503;

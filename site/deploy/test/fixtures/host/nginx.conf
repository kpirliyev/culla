# STAND-IN for the host's /etc/nginx/nginx.conf, for the tests only. It is
# not installed anywhere. It sets at http level what the real host's
# nginx.conf sets (ssl_protocols, ssl_prefer_server_ciphers, server_tokens,
# gzip), so that Culla's files setting any of them again fail nginx -t here
# as they would on the host. The rest follows Debian's packaged nginx.conf.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/access.log;

    gzip on;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}

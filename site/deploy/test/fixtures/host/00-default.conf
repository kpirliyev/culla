# STAND-IN for the host's /etc/nginx/conf.d/00-default.conf, for the tests
# only; Culla never installs or changes this file. It has what the real one
# has: host-wide TLS settings and client timeouts at http level, and the two
# catch-all servers (port 80 answers certificate challenges and otherwise
# closes the connection; port 443 rejects the TLS handshake).
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 30s;
send_timeout 10s;

server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/snippets/acme-challenge.conf;
    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# STAND-IN for another site's configuration on the shared host, for the
# setup-host.sh tests only: it must be byte-for-byte the same afterwards.
server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/letsencrypt/live/another-site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/another-site/privkey.pem;
    return 404;
}

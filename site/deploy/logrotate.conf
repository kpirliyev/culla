# logrotate rule for the cullaapp.com logs.
# Installed as /etc/logrotate.d/cullaapp.com by setup-host.sh.
#
# Daily, 30 days kept: access.log and error.log. "delaycompress" leaves
# yesterday's file (.1) plain; count.py reads .1 and the older .N.gz files.
# "create 0640" without owner and group keeps the owner and group of the
# file being rotated (www-data or nginx, depending on the distribution).

/data/cullaapp.com/log/*.log {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    # Numbered names (.1, .2.gz ...) even where the global logrotate.conf
    # turns on dateext (Fedora/RHEL do); count.py expects numbers.
    nodateext
    create 0640
    sharedscripts
    postrotate
        # Ask nginx to reopen its log files (same as `nginx -s reopen`).
        if [ -s /run/nginx.pid ]; then
            kill -USR1 "$(cat /run/nginx.pid)"
        fi
    endscript
}

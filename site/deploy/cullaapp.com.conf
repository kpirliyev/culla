# nginx configuration for https://cullaapp.com
#
# Installed as /etc/nginx/conf.d/cullaapp.com.conf by setup-host.sh (through
# remote-install.sh), which first chooses the variant lines: see "Variants"
# at the top of remote-install.sh. Lines marked #@www are only for
# www.cullaapp.com, #@ipv6 only for listening on [::].
#
# The server may be shared with other sites. Files under conf.d are included
# inside the `http { }` block of nginx.conf; this file adds only its own maps
# and log format there. Everything else at http level (TLS protocols,
# ciphers and session cache, server_tokens, gzip, timeouts) and the default
# servers for unknown names belong to the host (nginx.conf and its own
# conf.d/00-default.conf): setting any of them here again is an error, and
# this file declares no default_server.
#
# Files of the host it uses:
#   /etc/nginx/snippets/acme-challenge.conf   serves /.well-known/acme-challenge/
#                                             from /var/www/letsencrypt, where
#                                             certbot --webroot writes
#
# Its own files (installed by setup-host.sh):
#   /etc/nginx/cullaapp/snippets/security-headers.conf
#   /etc/nginx/cullaapp/snippets/tls.conf
#   /etc/nginx/cullaapp/snippets/download-default.conf
#   /etc/nginx/cullaapp/errors/           small static error pages
#   /etc/nginx/cullaapp/download-target.conf   written by every `deploy.sh`
#                                              once a release is published
#
# Paths on the server:
#   /data/cullaapp.com/www/     the generated site (served)
#   /data/cullaapp.com/log/     access.log, error.log
#   /data/cullaapp.com/stats/   CSV counts (not served)
#
# The disk images are not on this server: they are assets of the releases
# on GitHub, and /download redirects there.


# ---------------------------------------------------------------------------
# Language for "/"
# ---------------------------------------------------------------------------
# GET / redirects to /en/, /ru/ or /tk/: the first of these three that
# appears in Accept-Language, in the order the browser wrote them. Region
# subtags count ("ru-RU", "en-GB"); q-values are not weighed, only order.
# English when none of the three appears or the header is missing.
#
# Step 1 finds the first matching language tag. The lazy (?:[^,]*,)*? skips
# whole comma-separated entries one at a time, so the earliest entry wins.
# A tag must start an entry ("ptk" or "entk" do not count) and end at "-",
# ";", ",", a space or the end of the header.
map $http_accept_language $cullaapp_lang_found {
    default                                          "";
    "~*^(?:[^,]*,)*? *(en|ru|tk)(?:[-;, ]|$)"        $1;
}
# Step 2 turns what was found into lower case ("RU" -> "ru").
map $cullaapp_lang_found $cullaapp_lang {
    default     en;
    "~*^ru$"    ru;
    "~*^tk$"    tk;
}


# ---------------------------------------------------------------------------
# Log format (one JSON object per line)
# ---------------------------------------------------------------------------
# escape=json escapes quotes, backslashes and control characters, so a line
# can always be parsed with a JSON parser. Times are ISO 8601 in the server's
# local time zone, with the offset.

# access.log: pages, assets and redirects, /download included, with the
# client's address as nginx sees it. count.py reads it for the visits;
# logrotate deletes it after 30 days.
log_format cullaapp_access escape=json
    '{"time":"$time_iso8601","ip":"$remote_addr","host":"$host",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"referrer":"$http_referer",'
    '"ua":"$http_user_agent"}';


# ---------------------------------------------------------------------------
# Plain HTTP: certificate challenges, and a redirect to https://cullaapp.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;                              #@ipv6
    server_name cullaapp.com;                    #@!www
    server_name cullaapp.com www.cullaapp.com;   #@www

    access_log /data/cullaapp.com/log/access.log cullaapp_access;
    error_log  /data/cullaapp.com/log/error.log crit;
    server_tokens off;

    include /etc/nginx/cullaapp/snippets/security-headers.conf;

    # The host's snippet: location ^~ /.well-known/acme-challenge/ with the
    # files certbot --webroot writes, for the first certificate and every
    # renewal. It adds no header of its own, so the security headers above
    # reach its answers too.
    include /etc/nginx/snippets/acme-challenge.conf;

    # The redirect sits inside "location /" rather than at server level on
    # purpose: a server-level return would run before locations are chosen
    # and redirect the challenges away too.
    location / {
        return 301 https://cullaapp.com$request_uri;
    }
}


#@begin www
# ---------------------------------------------------------------------------
# https://www.cullaapp.com: redirect to https://cullaapp.com
# ---------------------------------------------------------------------------
server {
    # "http2 on;" needs nginx 1.25.1 or later. On an older nginx, remove it
    # and write "listen 443 ssl http2;" instead (in every HTTPS server).
    listen 443 ssl;
    listen [::]:443 ssl;                         #@ipv6
    http2 on;
    server_name www.cullaapp.com;

    include /etc/nginx/cullaapp/snippets/tls.conf;
    include /etc/nginx/cullaapp/snippets/security-headers.conf;

    access_log /data/cullaapp.com/log/access.log cullaapp_access;
    error_log  /data/cullaapp.com/log/error.log crit;
    server_tokens off;

    return 301 https://cullaapp.com$request_uri;
}
#@end www


# ---------------------------------------------------------------------------
# https://cullaapp.com: the site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;                         #@ipv6
    http2 on;
    server_name cullaapp.com;

    include /etc/nginx/cullaapp/snippets/tls.conf;

    root  /data/cullaapp.com/www;
    index index.html;

    # Every request of this server goes to access.log.
    access_log /data/cullaapp.com/log/access.log cullaapp_access;

    # "crit" keeps the everyday noise out of the error log (missing files,
    # closed connections, TLS handshake failures); what remains is rare and
    # about the server itself.
    error_log  /data/cullaapp.com/log/error.log crit;
    log_not_found off;

    server_tokens off;
    charset utf-8;

    # Redirects that nginx makes itself (such as /en -> /en/) use a path,
    # not a full URL built from the Host header.
    absolute_redirect off;

    # Serve the .gz files made at build time; never compress on the fly.
    gzip off;
    gzip_static on;
    gzip_vary on;

    # Headers for every response of this server. Each location below that
    # adds a header of its own includes this file again (see the file).
    include /etc/nginx/cullaapp/snippets/security-headers.conf;

    error_page 404 /404.html;
    error_page 500 502 503 504 /_errors/50x.html;

    # --- Error pages -------------------------------------------------------

    # The site's own 404 page, from the generated site.
    location = /404.html {
        internal;
        include /etc/nginx/cullaapp/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Small static pages for 5xx and for /download before the first
    # release, installed outside the web root. Not marked internal so that
    # their stylesheet can be fetched.
    location ^~ /_errors/ {
        alias /etc/nginx/cullaapp/errors/;
        include /etc/nginx/cullaapp/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # --- Language choice ---------------------------------------------------

    location = / {
        include /etc/nginx/cullaapp/snippets/security-headers.conf;
        add_header Vary "Accept-Language" always;
        add_header Cache-Control "no-cache" always;
        return 302 /$cullaapp_lang/;
    }

    # --- Pages and assets --------------------------------------------------

    # HTML and anything else without a hash in its name: the browser keeps
    # it but asks again every time (an unchanged file costs a 304).
    # A directory without a trailing slash (/en) is redirected to /en/ by
    # nginx itself; /en/ serves /en/index.html.
    location / {
        include /etc/nginx/cullaapp/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Nuxt's build output: every file name contains a content hash, so a
    # changed file always has a new name and can be cached for a year.
    location ^~ /_nuxt/ {
        include /etc/nginx/cullaapp/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Except Nuxt's build manifest (/_nuxt/builds/latest.json), which keeps
    # its name from build to build.
    location ^~ /_nuxt/builds/ {
        include /etc/nginx/cullaapp/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Images and fonts outside /_nuxt/ may keep their name across releases,
    # so they are cached for a day only.
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        include /etc/nginx/cullaapp/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # --- Download ----------------------------------------------------------

    # /download is a stable short link to the newest disk image, which is an
    # asset of the release on GitHub. The target is one line in a separate
    # file that every `deploy.sh` writes from site/release.json once the
    # release is published, so this file never changes for a release:
    #   return 302 https://github.com/<repository>/releases/download/v<version>/<file>;
    # The pattern "download-target.con[f]" matches exactly that one file, and
    # an include pattern that matches nothing is not an error: before the
    # first release the include adds nothing and the default below answers
    # 503 with a friendly page.
    location = /download {
        include /etc/nginx/cullaapp/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        error_page 503 /_errors/download-503.html;
        include /etc/nginx/cullaapp/download-target.con[f];
        include /etc/nginx/cullaapp/snippets/download-default.conf;
    }
}
